name: Deploy

# main への push（= PR マージ）で本番デプロイ
on:
  push:
    branches: [main]
  workflow_dispatch:

# 連続 push が来ても古い実行はキャンセルして最新だけ流す
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # vp をグローバル導入し、Node セットアップ・依存キャッシュ・vp install まで実施
      # （vite-plus のバージョンは package.json / catalog から自動解決）
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "lts"
          cache: true

      # package.json の build スクリプト（tsc && vp build）を実行
      - run: vp run build

      # package.json の deploy スクリプト（wrangler deploy）を実行
      # wrangler は CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID を環境変数から読む
      - run: vp run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
